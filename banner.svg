<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="perez66607 - Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .fade { opacity: 0; animation: fadeIn 0.6s ease forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .9s }
      .d3 { animation-delay: 1.6s } .d4 { animation-delay: 2.3s } .d5 { animation-delay: 3s }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1000" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1000" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="999" height="319" rx="18" fill="none" stroke="#30363d"/>

  <!-- Left: identity -->
  <g class="fade d1">
    <text x="60" y="95" font-size="15" fill="#8b949e" letter-spacing="3">WEB DEVELOPER · AUTOMATION</text>
  </g>
  <g class="fade d2">
    <text x="60" y="160" font-size="58" font-weight="700" fill="url(#accent)">perez66607</text>
  </g>
  <g class="fade d3">
    <text x="60" y="205" font-size="18" fill="#c9d1d9">Interfaces limpias, código ligero y</text>
    <text x="60" y="231" font-size="18" fill="#c9d1d9">automatización que ahorra horas.</text>
  </g>
  <g class="fade d4">
    <rect x="60" y="256" width="8" height="8" rx="2" fill="#3fb950" class="pulse"/>
    <text x="78" y="264" font-size="13" fill="#3fb950">Disponible para proyectos</text>
  </g>

  <!-- Right: terminal window -->
  <g class="float">
    <rect x="560" y="60" width="380" height="200" rx="12" fill="#0d1117" stroke="#30363d"/>
    <rect x="560" y="60" width="380" height="32" rx="12" fill="#161b22"/>
    <rect x="560" y="80" width="380" height="12" fill="#161b22"/>
    <circle cx="582" cy="76" r="5" fill="#ff5f56"/>
    <circle cx="602" cy="76" r="5" fill="#ffbd2e"/>
    <circle cx="622" cy="76" r="5" fill="#27c93f"/>
    <text x="750" y="80" font-size="11" fill="#8b949e" text-anchor="middle">~/perez66607</text>

    <g class="fade d2">
      <text x="580" y="122" font-size="13"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
      <text x="580" y="142" font-size="13" fill="#58a6ff">frontend + python dev</text>
    </g>
    <g class="fade d3">
      <text x="580" y="170" font-size="13"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> cat stack.json</tspan></text>
      <text x="580" y="190" font-size="13" fill="#a371f7">["HTML","CSS","JS","Python"]</text>
    </g>
    <g class="fade d4">
      <text x="580" y="218" font-size="13"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> ./build --ship</tspan></text>
      <text x="580" y="238" font-size="13" fill="#3fb950">✔ deployed in 0.8s</text>
    </g>
    <g class="fade d5">
      <rect x="580" y="246" width="8" height="2" fill="#c9d1d9" class="cursor"/>
    </g>
  </g>
</svg>
